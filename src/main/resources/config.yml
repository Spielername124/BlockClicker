global-flags:
  mutually-exclusive-regions: true
  #setting to decide whether Items are dropped (false) or deposited directly to the players inventory
  deposit-to-inventory: false
  #setting the bonus to the loot chance from fortune enchantments (in percent), this modifier is multiplicative.
  fortune-modifier-per-level: 10
  luck-modifier-per-level: 10
  bad-Luck-modifier-per-level: -10
  #makes that reward sound are hearable by any player if set to true
  public-reward-sound: true
  #if set to false for fortune modifier 10, level 2 would mean that the final fortune multiplier would amount to a 20% bonus instead of a bonus of 1.21 (= 1.1^2). Default is true
  intra-modifire-multiplicativity: true
  #if set to false, a fortune modifier of 10 and a luck modifier of 10, and fortune 1 and luck 1 would amount to a 20% bonus instead of a bonus of 1.21 (= 1.1 * 1.1) Default is true
  inter-modifire-multiplicativity: true

#define the groups of world guard regions, that share a lootable
zone-groups:
  dirtArea:
    #list your regions
    region-ids:
      - "clickerzone"
  default:
    #setting this flag enables the loot table of this group everywhere
    everywhere: true

#Define groups of tools to make drops individualized to certain tools
#Important: If tools are in multiple groups, they will drop loot from all the lists they are in.
tool-groups:
  default:
    always-possible: true
  shovels:
    tools:
      - "DIAMOND_SHOVEL"
      - "WOODEN_SHOVEL"

findable-containers:
  normal-chest:
    container-type: "BARREL"
    shuffle: true
    loot:
      - item: "CLAY_BALL"
        amount: 64
        chance: 1
      - item: "DIAMOND"
        amount-lower-bound: 1
        amount-upper-bound: 10

  smelting-furnace:
    container-type: FURNACE
    shuffle: false
    loot:
      #guarantees that one of th listed rewards gets dropped. If used for container Items, all possible rewards must be items.
      - guaranteed-reward:
          - item: RAW_IRON
            weight: 10
            amount-lower-bound: 2
            amount-upper-bound: 6
          - item: RAW_GOLD
            weight: 5
            amount-lower-bound: 1
            amount-upper-bound: 4
          - item: RAW_COPPER
            weight: 15
            amount-lower-bound: 4
            amount-upper-bound: 12
      - guaranteed-reward:
          - item: COAL
            weight: 20
            amount-lower-bound: 5
            amount-upper-bound: 15
          - item: CHARCOAL
            weight: 10
            amount-lower-bound: 5
            amount-upper-bound: 15
          - item: OAK_LOG
            weight: 5
            amount-lower-bound: 2
            amount-upper-bound: 8

#The chance has to be given as double between 0 and 100.
dirtArea:
  default:
    DIRT:
      - item: "xp"
        # you can set an upper and lower bound to give the player a random amount within these bounds back.
        # generally a set amount does override the bounds.
        # if no amount is specified but a lower or upperbound is specified, are the defaults for the bounds 0 and 64.
        amount-lower-bound: 0
        amount-upper-bound: 10
        chance: 100

        #if like here, no amount at all is specified, it defaults to 1.
      - item: "CLAY_BALL"
        chance: 0

        # if not chance is specified, like it is here, the item is dropped with a 100% chance.
      - item: "DIAMOND"
        chance: 0.001
        amount: 1

        # this lets you define a command as a possible reward. The Command is generally parsed by PlaceholderAPI.
        # additionally the plugin lets you access the x y z values of the block that has been removed with the variables you can see below
      - command: "summon lightning_bolt %blockXValue% %blockYValue% %blockZValue%"
        chance: 10

  shovels:
    DIRT:
      - item: "xp"

        #You can create custom items via the bc saveitem <name of the Item> command while holding the item in your main hand.
        # You can award a custom reward like this (create the item, replace oldShovel by your items name and remove the  #in the     following lines)

        #- item: "oldShovel"
        #is-custom: true
        #amount: 5
        #chance: 100

      - item: "CLAY_BALL"
        amount: 5
        chance: 0

      - item: "DIAMOND"
        amount: 1
        chance: 10

        # since this reward is defined on the outside of a container, any possible reward may be guaranteed
      - guaranteed-reward:
          - container: "normal-chest"
            #sets weight for the roll of which reward from the guaranteed rewards gets granted
            weight: 10

          - container: "smelting-furnace"
            weight: 1

            #gives an effect
          - effect: SPEED
            # defines the effect duration
            duration-duration: 10
            # defines the give effect
            level: 1
            weight: 5
            sound: "entity.firework_rocket.launch"
            sound-priority: 1

        # defines chance for the guaranteed reward
        chance: 25

        #chooses a sound that should be played if the reward is awarded
        sound: "ui.toast.challenge_complete"
        # sets the priority of the sound chosen for this reward. The system only plays the first sound of the highest priority it received
        sound-priority: 0

        #spawns a zombie
      - mob: "ZOMBIE"
        chance: 0.1