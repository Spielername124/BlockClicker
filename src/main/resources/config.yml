### TOOL GRUPPEN

#Define groups of tools to make drops individualized to certain tools
#Important: If tools are in multiple groups, they will drop loot from all the lists they are in.
tool-groups:
  #you can also use any of your defined custom items as tools
  tier1_copper:
    tools:
      - "copper_pickaxe"
      - "stone_pickaxe"
  tier2_iron:
    tools:
      - "iron_pickaxe"
  tier3_diamond:
    tools:
      - "diamond_pickaxe"
      - "golden_pickaxe"
  default:
    always-possible: true
  traderTier:
    always-possible: true



